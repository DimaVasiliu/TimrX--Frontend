name = "timrx-blog-proxy"
main = "blog-proxy.js"
compatibility_date = "2024-01-01"

# Route bindings - the Worker owns the same-origin blog/SEO surface on
# timrx.live. Cloudflare Pages still owns the rest of the static site,
# including /blogs and normal frontend assets. Keep /api/* reserved for blog
# backend traffic on the apex domain.
routes = [
  { pattern = "timrx.live/blog", zone_name = "timrx.live" },
  { pattern = "timrx.live/blog/*", zone_name = "timrx.live" },
  { pattern = "timrx.live/api/*", zone_name = "timrx.live" },
  { pattern = "timrx.live/rss.xml", zone_name = "timrx.live" },
  { pattern = "timrx.live/sitemap-blogs.xml", zone_name = "timrx.live" },
  { pattern = "timrx.live/sitemap.xml", zone_name = "timrx.live" },
  { pattern = "timrx.live/sitemap-recent.xml", zone_name = "timrx.live" },
  { pattern = "timrx.live/robots.txt", zone_name = "timrx.live" },
  { pattern = "timrx.live/tools*", zone_name = "timrx.live" },
  { pattern = "timrx.live/read*", zone_name = "timrx.live" },
  { pattern = "timrx.live/avi-to-mp4*", zone_name = "timrx.live" },
  { pattern = "timrx.live/3d-models/*", zone_name = "timrx.live" },
  { pattern = "timrx.live/text-to-3d/*", zone_name = "timrx.live" },
  { pattern = "timrx.live/converters/*", zone_name = "timrx.live" },
  { pattern = "timrx.live/sitemap-seo.xml", zone_name = "timrx.live" },

  # OUTAGE WORKAROUND — the Worker serves these 12 pages directly from
  # outage-pages.js because Cloudflare Pages currently returns empty 500s
  # for them. Remove these 12 routes once Pages serves them correctly.
  { pattern = "timrx.live/hub", zone_name = "timrx.live" },
  { pattern = "timrx.live/3dprint", zone_name = "timrx.live" },
  { pattern = "timrx.live/pricing", zone_name = "timrx.live" },
  { pattern = "timrx.live/ai-image-generator", zone_name = "timrx.live" },
  { pattern = "timrx.live/ai-video-generator", zone_name = "timrx.live" },
  { pattern = "timrx.live/ai-3d-generator", zone_name = "timrx.live" },
  { pattern = "timrx.live/text-to-3d", zone_name = "timrx.live" },
  { pattern = "timrx.live/image-to-3d", zone_name = "timrx.live" },
  { pattern = "timrx.live/3d-print-model-generator", zone_name = "timrx.live" },
  { pattern = "timrx.live/ai-animation-generator", zone_name = "timrx.live" },
  { pattern = "timrx.live/ai-game-assets", zone_name = "timrx.live" },
  { pattern = "timrx.live/ai-texture-generator", zone_name = "timrx.live" }
]

