<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>TimrX — Asset Stage prototype (new workspace)</title>
<style>
/* ==========================================================================
   PROTOTYPE SHELL — reproduces the NEW workspace geometry from your working
   tree: variables.css (new palette), workspace.css (.ws-grid = "rail" / "."),
   nav.css (fixed command bar + tray). Nothing in this block ships.
   ========================================================================== */
:root{
  --bg:#080b0c; --surface-0:#07090a; --surface-1:#0d1012; --surface-2:#121719; --surface-3:#182024;
  --text:#f2f5f3; --muted:#a7b0b2;
  --line:rgba(226,236,237,.075); --border-soft:rgba(226,236,237,.09); --border-strong:rgba(226,236,237,.16);
  --text-soft:rgba(242,245,243,.74); --text-dim:rgba(167,176,178,.58);
  --accent-blue:#7fc8c2; --accent-purple:#b8a77a; --accent-pink:#c9909b;
  --accent-blue-rgb:127,200,194; --accent-purple-rgb:184,167,122; --accent-pink-rgb:201,144,155;
  --accent-neo:#d8c879;
  --font-ui:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-display:"Space Grotesk",Inter,system-ui,sans-serif;
  --navH:62px; --ws-navH:70px;
  --ws-cmdbar-h:82px; --ws-cmdbar-gap:24px; --ws-cmdbar-w:980px;
  --ws-cmdbar-zone:calc(var(--ws-cmdbar-h) + var(--ws-cmdbar-gap) * 2);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{
  background:
    radial-gradient(ellipse at 50% 20%, rgba(var(--accent-blue-rgb),.075), transparent 36%),
    radial-gradient(ellipse at 50% 62%, rgba(32,47,50,.32), transparent 54%),
    radial-gradient(ellipse at 50% 100%, rgba(var(--accent-purple-rgb),.045), transparent 42%),
    linear-gradient(180deg,#080b0c 0%,#0d1214 46%,#090c0d 100%);
  color:var(--text);font-family:var(--font-ui);line-height:1.6;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;overflow-y:auto;min-height:100vh;
}
.ws-header{position:fixed;inset:0 0 auto;height:var(--ws-navH);z-index:70;
  display:flex;align-items:center;gap:14px;padding:0 22px;pointer-events:none}
.ws-header > *{pointer-events:auto}
.ws-brand{display:flex;align-items:center;gap:12px;font-family:var(--font-display);
  font-size:26px;font-weight:700;letter-spacing:.01em}
.ws-brand__dot{width:34px;height:34px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#9fe0da,#2b4f52);border:1px solid var(--border-soft)}
.ws-brand span{color:var(--accent-blue)}
.ws-header .sp{flex:1}
.ws-chip{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:999px;
  font-size:13px;color:var(--text-soft);border:1px solid var(--border-soft);
  background:rgba(24,32,36,.6);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.ws-chip--buy{background:#f2f5f3;color:#0b0f10;font-weight:700;border-color:transparent}

/* ---- .ws-grid : the NEW layout. Row 1 = creation dock, row 2 = free. ---- */
.timrx-3dprint{padding:var(--ws-navH) 0 0;overflow:hidden;height:100vh;position:relative}
.timrx-3dprint .ws-grid{
  display:grid;
  grid-template-columns:minmax(0,1fr);
  grid-template-rows:auto minmax(0,1fr);
  grid-template-areas:"rail" ".";          /* UNCHANGED from workspace.css */
  gap:14px 12px;padding:12px;padding-top:24px;
  height:calc(100vh - var(--ws-navH));overflow:hidden;position:relative;
}
.timrx-3dprint .ws-rail{
  grid-area:rail;justify-self:center;display:grid;
  grid-template-columns:minmax(180px,230px) minmax(160px,210px) minmax(160px,210px);
  gap:16px;align-items:start;justify-content:center;width:min(100%,740px);
  padding:8px 10px 16px;border:0;background:transparent;perspective:1200px;
  position:relative;z-index:3;
}
.rail-btn{display:grid;grid-template-columns:auto minmax(0,1fr);
  grid-template-areas:"orb label" "orb meta";align-items:center;column-gap:13px;
  width:100%;min-height:86px;padding:14px 16px;border:0;background:transparent;
  color:rgba(226,236,237,.78);cursor:pointer;font:inherit;text-align:left}
.rail-btn__orb{grid-area:orb;width:52px;height:52px;display:grid;place-items:center}
.rail-btn__orb svg{width:26px;height:26px;stroke-width:1.8}
.rail-btn__label{grid-area:label;font-family:var(--font-display);font-size:16px;font-weight:700;
  line-height:1.05;letter-spacing:.045em;text-transform:uppercase}
.rail-btn__meta{grid-area:meta;margin-top:4px;color:rgba(177,188,190,.58);font-size:11px;font-weight:600;line-height:1.25}
.rail-btn.is-active{color:#f2f5f3}
.rail-btn.is-active .rail-btn__orb svg{color:var(--accent-blue)}

/* ---- fixed bottom chrome ---- */
.ws-tray{position:fixed;left:50%;bottom:calc(var(--ws-cmdbar-gap) + var(--ws-cmdbar-h) + 14px);
  transform:translateX(-50%);z-index:59;display:flex;align-items:center;justify-content:center;
  gap:8px;width:min(var(--ws-cmdbar-w),calc(100vw - 40px));padding:0 6px}
.ws-tray__btn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px;border-radius:999px;
  font:inherit;font-size:14px;color:var(--text-soft);cursor:pointer;
  border:1px solid var(--border-soft);background:rgba(20,27,30,.72);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.ws-tray__btn.is-active{background:rgba(var(--accent-blue-rgb),.16);border-color:rgba(var(--accent-blue-rgb),.34);color:#dff3f0}
.ws-tray__btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8}
.ws-cmd-trigger{position:fixed;left:50%;bottom:var(--ws-cmdbar-gap);transform:translateX(-50%);z-index:60;
  display:inline-flex;align-items:center;gap:16px;width:min(var(--ws-cmdbar-w),calc(100vw - 40px));
  min-height:var(--ws-cmdbar-h);padding:12px 14px 12px 24px;font:inherit;font-size:18px;
  color:rgba(226,236,237,.76);text-align:left;cursor:pointer;
  background:radial-gradient(circle at 22% 0%,rgba(var(--accent-blue-rgb),.075),transparent 30%),
    radial-gradient(circle at 88% 100%,rgba(var(--accent-purple-rgb),.06),transparent 34%),
    linear-gradient(180deg,rgba(24,32,36,.9),rgba(12,16,18,.88));
  backdrop-filter:blur(22px) saturate(1.12);-webkit-backdrop-filter:blur(22px) saturate(1.12);
  border:1px solid var(--border-strong);border-radius:999px;
  box-shadow:0 24px 62px rgba(0,0,0,.38)}
.ws-cmd-trigger__icon{width:22px;height:22px;fill:none;stroke:var(--accent-blue);stroke-width:2}
.ws-cmd-trigger__label{flex:1}
.ws-cmd-trigger__chips{display:flex;gap:16px;font-size:12px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--text-dim)}
.ws-cmd-trigger__kbd{font-size:12px;color:var(--text-dim);padding:0 10px}

/* prototype-only control strip */
.proto-ctl{position:fixed;left:14px;top:calc(var(--ws-navH) + 10px);z-index:900;
  display:flex;flex-direction:column;gap:5px;padding:8px;border-radius:16px;
  border:1px solid var(--border-soft);background:rgba(10,14,15,.9);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);font-size:11px;max-width:180px}
.proto-ctl .lbl{color:var(--text-dim);letter-spacing:.14em;text-transform:uppercase;font-size:8.5px;padding:4px 4px 1px}
.proto-ctl .row{display:flex;gap:5px;flex-wrap:wrap}
.proto-ctl button{border:1px solid var(--border-soft);background:rgba(255,255,255,.03);
  color:var(--text-soft);font:inherit;font-weight:600;padding:6px 10px;border-radius:999px;cursor:pointer}
.proto-ctl button:hover{background:rgba(255,255,255,.08);color:#fff}
.proto-ctl button.on{background:var(--accent-blue);color:#08100f;border-color:var(--accent-blue)}
.proto-toast{position:fixed;left:50%;top:calc(var(--ws-navH) + 14px);transform:translate(-50%,-6px);z-index:950;
  padding:9px 16px;border-radius:999px;font-size:12px;font-weight:600;
  background:rgba(var(--accent-blue-rgb),.14);border:1px solid rgba(var(--accent-blue-rgb),.34);
  color:#cfeae6;opacity:0;pointer-events:none;transition:.25s}
.proto-toast.show{opacity:1;transform:translate(-50%,0)}
/* fake control sheet, to show how the stage recedes */
.fake-sheet{position:fixed;left:50%;bottom:calc(var(--ws-cmdbar-gap) + var(--ws-cmdbar-h) + 18px);
  transform:translateX(-50%) translateY(14px) scale(.985);z-index:58;
  width:min(660px,calc(100vw - 32px));height:min(560px,calc(100vh - 300px));
  border:1px solid var(--border-soft);border-radius:26px;
  background:radial-gradient(120% 140% at 12% 0%,rgba(255,255,255,.05),transparent 42%),
    linear-gradient(180deg,rgba(20,27,30,.97),rgba(10,14,15,.98));
  backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);
  box-shadow:0 40px 100px rgba(0,0,0,.55);padding:22px;
  opacity:0;visibility:hidden;transition:.34s cubic-bezier(.16,1,.3,1)}
body.ws-panel-open .fake-sheet{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0) scale(1)}
.fake-sheet h3{margin:0 0 4px;font-family:var(--font-display);font-size:17px}
.fake-sheet p{margin:0 0 18px;font-size:12px;color:var(--text-dim)}
.fake-skel{height:40px;border-radius:12px;background:rgba(255,255,255,.04);margin-bottom:10px}
.fake-skel.tall{height:120px}

@media (max-width:900px){
  .timrx-3dprint .ws-rail{grid-template-columns:minmax(0,1fr);width:min(100%,420px);gap:2px}
  .rail-btn{min-height:64px}
  .proto-ctl{display:none}
}
/* mirrors the responsive command-bar sizes in nav.css */
@media (max-width:1180px){ :root{ --ws-cmdbar-h:66px } }
@media (max-width:820px){  :root{ --ws-cmdbar-h:58px; --ws-cmdbar-gap:18px; --ws-cmdbar-w:600px } }
@media (max-width:640px){  :root{ --ws-cmdbar-h:54px; --ws-cmdbar-gap:12px } }
@media (max-width:480px){  :root{ --ws-cmdbar-h:48px; --ws-cmdbar-gap:10px } }

/* ==========================================================================
   ASSET STAGE — this is the part that ships.
   Host: <div class="ws-stage"> as a child of .ws-grid, spanning every row so
   it reads as one field behind the whole workspace, then masked away under
   the creation dock and the command bar so the chrome stays legible.
   ========================================================================== */
.ws-stage{
  grid-area:1 / 1 / -1 / -1;      /* span the whole grid, behind everything  */
  position:relative;
  z-index:0;
  overflow:hidden;
  min-height:0;
  pointer-events:none;            /* only the cards opt back in              */

  --afx:0;                        /* pointer parallax X, px (JS)             */
  --afy:0;                        /* pointer parallax Y, px (JS)             */
  --af-in:0;                      /* 0 → 1 mount reveal                       */
  --af-dim:1;                     /* 1 → 0.28 when an overlay takes focus     */

  /* How much room the bottom chrome needs. The tray only exists while a model
     panel is active, so the clearance grows only then (see below) instead of
     permanently cutting the bottom of the field. */
  --af-clear-bottom:calc(var(--ws-cmdbar-zone) + 24px);
  --af-clear-top:15%;
  /* Set by JS: how far the grid box currently runs past the bottom of the
     viewport. `.ws-grid` is `height: calc(100vh - var(--ws-navH))`, which is
     only correct while the workspace starts at exactly --ws-navH — it does not
     today (see the .ws-corner-launcher note in the README). */
  --af-overflow:0px;

  /* Vertical mask: fade out behind the creation dock and above the command
     bar, so the field never competes with either. Reads --ws-cmdbar-zone, so
     resizing the bar in nav.css moves this automatically. */
  -webkit-mask-image:linear-gradient(180deg,
    transparent 0,
    rgba(0,0,0,.45) 6%,
    #000 var(--af-clear-top),
    #000 calc(100% - var(--af-clear-bottom) - var(--af-overflow) - 70px),
    rgba(0,0,0,.28) calc(100% - var(--af-clear-bottom) - var(--af-overflow) - 16px),
    transparent calc(100% - var(--af-clear-bottom) - var(--af-overflow) + 12px));
  mask-image:linear-gradient(180deg,
    transparent 0,
    rgba(0,0,0,.45) 6%,
    #000 var(--af-clear-top),
    #000 calc(100% - var(--af-clear-bottom) - var(--af-overflow) - 70px),
    rgba(0,0,0,.28) calc(100% - var(--af-clear-bottom) - var(--af-overflow) - 16px),
    transparent calc(100% - var(--af-clear-bottom) - var(--af-overflow) + 12px));
  transition:opacity .45s ease,filter .45s ease;
}

/* The model tool tray rides above the command bar; give it room only when it
   is actually out. Same condition nav.css uses to reveal it. */
body.ws-model-mode.ws-intro-done .ws-stage,
body.ws-video-mode.ws-intro-done .ws-stage{
  --af-clear-bottom:calc(var(--ws-cmdbar-zone) + 96px);
}

/* Horizontal fade lives on the inner wrapper: two masks on one element needs
   mask-composite, which is still uneven across engines. */
.ws-stage__inner{
  position:absolute;inset:0;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 9%,#000 91%,transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0,#000 9%,#000 91%,transparent 100%);
}

/* --- ambient wash, tuned to the new palette ----------------------------- */
.ws-stage__wash{
  position:absolute;inset:-22%;pointer-events:none;
  background:
    radial-gradient(36% 40% at 26% 34%,rgba(var(--accent-blue-rgb),.14),transparent 70%),
    radial-gradient(32% 36% at 74% 64%,rgba(var(--accent-pink-rgb),.09),transparent 70%),
    radial-gradient(30% 34% at 54% 88%,rgba(var(--accent-purple-rgb),.10),transparent 70%);
  filter:blur(34px);
  animation:af-wash 40s ease-in-out infinite alternate;
  opacity:calc(.9 * var(--af-in));
}
@keyframes af-wash{
  0%  {transform:translate3d(-3%,-2%,0) scale(1)}
  50% {transform:translate3d(2.5%,3%,0) scale(1.07)}
  100%{transform:translate3d(-1.5%,2%,0) scale(1.02)}
}

/* Dock punch-out. A flat top fade would have to reach a third of the way down
   to clear the creation dock's two lines of type, killing the top corners for
   nothing — the dock is only ~740px wide and centred. So the clearance is a
   soft ellipse over the dock instead. */
.ws-stage__field{
  position:absolute;inset:0;
  /* Sized in px, not %, on purpose: the dock is `width:min(100%,740px)`, so a
     percentage punch is far too wide at 2560px and too narrow at 1100px. */
  -webkit-mask-image:radial-gradient(520px 210px at 50% 0%,
    transparent 0,transparent 68%,rgba(0,0,0,.55) 86%,#000 100%);
  mask-image:radial-gradient(520px 210px at 50% 0%,
    transparent 0,transparent 68%,rgba(0,0,0,.55) 86%,#000 100%);
}

/* --- layer 1: placement + pointer parallax ------------------------------ */
.af__slot{
  position:absolute;left:var(--x);top:var(--y);width:var(--w);
  translate:-50% -50%;
  transform:translate3d(calc(var(--afx) * var(--par)),calc(var(--afy) * var(--par)),0);
  transition:transform .5s cubic-bezier(.22,1,.36,1),opacity .55s ease,width .45s cubic-bezier(.22,1,.36,1);
  z-index:var(--z);
  opacity:calc(var(--o) * var(--af-in) * var(--af-dim));
  filter:blur(var(--blur));
  will-change:transform;
}
.af__slot.is-swapping{opacity:0;transition:opacity .45s ease}

/* --- layer 2: endless organic drift (compositor only) ------------------- */
.af__float{
  animation:var(--drift) var(--dur) ease-in-out infinite alternate;
  animation-delay:var(--delay);transform-origin:50% 50%;
}
@keyframes af-drift-a{from{transform:translate3d(0,0,0) rotate(0)}      to{transform:translate3d(2.5%,-7%,0) rotate(1.2deg)}}
@keyframes af-drift-b{from{transform:translate3d(0,2%,0) rotate(.7deg)} to{transform:translate3d(-4%,-5%,0) rotate(-1.4deg)}}
@keyframes af-drift-c{from{transform:translate3d(-2%,-3%,0) rotate(-.9deg)}to{transform:translate3d(3.5%,4%,0) rotate(1deg)}}
@keyframes af-drift-d{from{transform:translate3d(1%,4%,0) rotate(1deg) scale(.985)}to{transform:translate3d(-2.5%,-4%,0) rotate(-.6deg) scale(1.015)}}

/* --- layer 3: the card --------------------------------------------------
   Deliberately quiet. The new workspace is thin type, hairline borders and
   muted surfaces; a glowing card wall would fight it. Contrast arrives on
   hover, not at rest. */
.af__card{
  position:relative;display:block;width:100%;padding:0;border:0;
  aspect-ratio:var(--ar);
  border-radius:clamp(9px,.9vw,15px);
  overflow:hidden;cursor:pointer;
  background:var(--surface-1,#0d1012);
  pointer-events:auto;
  box-shadow:0 var(--shy) var(--shb) rgba(0,0,0,.42);
  transition:transform .32s cubic-bezier(.22,1,.36,1),box-shadow .32s ease;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
.af__card::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  border:1px solid var(--border-soft,rgba(226,236,237,.09));
  transition:border-color .32s ease,box-shadow .32s ease;
}
.af__card img{width:100%;height:100%;object-fit:cover;display:block;
  transition:transform .55s cubic-bezier(.22,1,.36,1)}
.af__card::before{
  content:"";position:absolute;inset:auto 0 0;height:62%;pointer-events:none;z-index:2;
  background:linear-gradient(to top,rgba(5,7,8,.9),transparent);
  opacity:0;transition:opacity .3s ease;
}

.af__chip{
  position:absolute;top:7px;left:7px;z-index:3;
  display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border-radius:999px;
  font-size:clamp(7px,calc(var(--w,140px) * .046),9px);
  font-weight:700;letter-spacing:.14em;text-transform:uppercase;line-height:1.4;
  background:rgba(7,9,10,.72);color:var(--text-soft,rgba(242,245,243,.74));
  border:1px solid var(--border-soft,rgba(226,236,237,.09));
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  opacity:0;transform:translateY(-3px);transition:.28s cubic-bezier(.22,1,.36,1);
}
.af__chip.is-model{color:var(--accent-blue,#7fc8c2);border-color:rgba(127,200,194,.3)}
.af__chip.is-image{color:var(--accent-neo,#d8c879);border-color:rgba(216,200,121,.3)}
.af__chip.is-video{color:var(--accent-pink,#c9909b);border-color:rgba(201,144,155,.3)}

.af__cap{
  position:absolute;left:0;right:0;bottom:0;z-index:3;padding:8px 9px 9px;text-align:left;
  font-size:clamp(9px,calc(var(--w,140px) * .05),11px);
  line-height:1.35;font-weight:400;color:rgba(242,245,243,.9);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  opacity:0;transform:translateY(6px);transition:.3s cubic-bezier(.22,1,.36,1);
}

@media (hover:hover){
  .af__card:hover,.af__card:focus-visible{
    transform:translateY(-5px) scale(1.04);
    box-shadow:0 24px 54px rgba(0,0,0,.5);outline:none;
  }
  .af__card:hover::after,.af__card:focus-visible::after{
    border-color:rgba(var(--accent-blue-rgb,127,200,194),.5);
    box-shadow:0 0 18px rgba(var(--accent-blue-rgb,127,200,194),.1) inset;
  }
  .af__card:hover img,.af__card:focus-visible img{transform:scale(1.06)}
  .af__card:hover::before,.af__card:focus-visible::before,
  .af__card:hover .af__cap,.af__card:focus-visible .af__cap,
  .af__card:hover .af__chip,.af__card:focus-visible .af__chip{opacity:1;transform:none}
  /* focus one, the field steps back */
  .ws-stage__field:hover .af__slot{
    opacity:calc(var(--o) * .34 * var(--af-in) * var(--af-dim));
    filter:blur(calc(var(--blur) + .8px));
  }
  .ws-stage__field .af__slot:hover{opacity:calc(var(--af-in) * var(--af-dim));filter:blur(0)}
}
.af__card:focus-visible{outline:2px solid var(--accent-blue,#7fc8c2);outline-offset:3px}

/* ==========================================================================
   WORKSPACE STATE REACTIONS
   The new shell is overlay-driven, so the stage has to answer to body state
   rather than own the screen.
   ========================================================================== */

/* viewer takes the row → the stage has no business being there */
body.ws-viewer-open .ws-stage,
body.tutorials-view .ws-stage,
body.community-view .ws-stage,
body.docs-view .ws-stage,
body.history-expanded .ws-stage{display:none}

/* an overlay took focus → recede, do not disappear */
body.ws-panel-open .ws-stage,
body.ws-cmd-open .ws-stage,
body.assets-modal-open .ws-stage{
  --af-dim:.26;
  filter:blur(3px);
  pointer-events:none;
}
body.ws-panel-open .ws-stage .af__card,
body.ws-cmd-open .ws-stage .af__card,
body.assets-modal-open .ws-stage .af__card{pointer-events:none}

/* Below 1280px `media/workspace-media.css` turns .ws-grid into
   `display:flex; height:auto` and unlocks page scroll, so grid-line placement
   is meaningless and the stage collapses to zero height. Pin it to the
   viewport instead — it is a background field, so being fixed under the
   scrolling column is exactly right. */
@media (max-width:1280px){
  .ws-stage{position:fixed;inset:var(--ws-navH,70px) 0 0 0;height:auto;grid-area:auto}
}

/* ==========================================================================
   RESPONSIVE — the layout is % based and container-driven, so this only
   tunes cost. Density comes from the container size in JS.
   ========================================================================== */
@media (max-width:900px){
  .af__cap{display:none}              /* no hover on touch — dead weight */
  /* the dock stacks into one tall column, so the punch-out follows it */
  .ws-stage__field{
    -webkit-mask-image:radial-gradient(300px 46% at 50% 0%,
      transparent 0,transparent 70%,rgba(0,0,0,.5) 86%,#000 100%);
    mask-image:radial-gradient(300px 46% at 50% 0%,
      transparent 0,transparent 70%,rgba(0,0,0,.5) 86%,#000 100%);
  }
  .ws-stage__inner{
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 4%,#000 96%,transparent 100%);
    mask-image:linear-gradient(90deg,transparent 0,#000 4%,#000 96%,transparent 100%);
  }
}
@media (max-width:560px){
  .ws-stage__wash{filter:blur(22px)}   /* cheaper blur on small GPUs */
}

/* ==========================================================================
   REDUCED MOTION — a still, composed collage. Still worth looking at.
   ========================================================================== */
@media (prefers-reduced-motion:reduce){
  .ws-stage__wash,.af__float{animation:none!important}

</style>

<script>
/* ==========================================================================
   TimrX Asset Stage — v0.2, rebuilt for the new overlay-driven workspace
   --------------------------------------------------------------------------
   Ships as 3dprint-modules/asset-stage.js. Mounts a single element into
   .ws-grid spanning every row, so the field reads as one composition behind
   the whole workspace rather than a box inside a pane.

   Motion budget: zero per-frame JS layout. Drift is CSS keyframes on the
   compositor; the only rAF work is writing two custom properties for pointer
   parallax, throttled to one write per frame.
   ========================================================================== */
(function(){
  'use strict';

  var BACKEND = window.TIMRX_3D_API_BASE || 'https://3d.timrx.live';

  var CFG = {
    FEED_URL      : BACKEND + '/api/_mod/inspire/feed',
    FEED_LIMIT    : 36,
    FEED_TIMEOUT  : 6000,
    CACHE_KEY     : 'timrx_inspire_cache',   // Inspire already warms this
    SHUFFLE_MS    : 6800,
    SHUFFLE_COUNT : 2,
    PARALLAX_MAX  : 22,
    DENSITY       : 'cozy'
  };

  /* Depth tiers, tuned down from the old page: the new shell is hairline
     borders and muted surfaces, so the field rests quiet and earns contrast
     on hover instead of at rest. */
  var TIERS = [
    /* far  */ { s:0.48, o:0.30, blur:1.0, par:0.18, z:10, shy:8,  shb:22 },
    /* mid  */ { s:0.76, o:0.55, blur:0.2, par:0.52, z:20, shy:14, shb:34 },
    /* near */ { s:1.14, o:0.86, blur:0.0, par:1.00, z:30, shy:22, shb:50 }
  ];
  var DRIFTS  = ['af-drift-a','af-drift-b','af-drift-c','af-drift-d'];
  var ASPECTS = { square:1, portrait:0.78, landscape:1.42 };

  var ICON = {
    model:'<svg viewBox="0 0 24 24" width="9" height="9" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>',
    image:'<svg viewBox="0 0 24 24" width="9" height="9" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 16l4.6-4.6a2 2 0 012.8 0L16 16M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>',
    video:'<svg viewBox="0 0 24 24" width="9" height="9" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 10l4.6-2.3A1 1 0 0121 8.6v6.8a1 1 0 01-1.4.9L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>'
  };

  var root, fieldEl, pool = [], slots = [], cursor = 0,
      shuffleTimer = null, rafId = null, pendingEvt = null,
      io = null, ro = null, resizeDeb = null, destroyed = false, still = false;

  // ==================================================================== DATA
  /* Muted to the new palette — teal, sand, rose, gold. The old neon set read
     as a different product next to this shell. */
  var PALETTE = [
    ['#7fc8c2','#12211f'],['#d8c879','#211d10'],['#c9909b','#221416'],
    ['#b8a77a','#1d1a12'],['#8fb9c9','#121c21'],['#a9c98f','#161f13'],
    ['#c9a98f','#211a14'],['#9f9fc9','#16161f']
  ];
  var FALLBACK_PROMPTS = [
    'Crystal wyrm reliquary, translucent quartz scales with ember glow',
    'Retro-futurist deep sea dive helmet, brushed brass and copper valves',
    'Biomechanical fox mask, porcelain plates split by cobalt seams',
    'Modular lunar rover scout, matte titanium and amber utility lights',
    'Gothic reliquary lantern, blackened iron and stained ruby glass',
    'Art nouveau perfume bottle, frosted emerald glass, dragonfly stopper',
    'Desert scavenger drone, asymmetrical plates, sand-worn orange paint',
    'Alchemist field pack, stitched leather with hanging potion vials',
    'Cyber monk bust, luminous tattoo channels across ceramic plates',
    'Coral reef automaton, brass ribs threaded with living polyps'
  ];

  function svgTile(i){
    var p = PALETTE[i % PALETTE.length], a = p[0], b = p[1], u = 's'+i;
    var shape = [
      '<circle cx="160" cy="152" r="72" fill="url(#o'+u+')"/>'+
      '<circle cx="160" cy="152" r="72" fill="none" stroke="'+a+'" stroke-opacity=".4" stroke-width="1.4"/>'+
      '<ellipse cx="136" cy="124" rx="24" ry="17" fill="#fff" opacity=".2"/>',

      '<path d="M160 68 L224 134 L194 234 L126 234 L96 134 Z" fill="url(#o'+u+')"/>'+
      '<path d="M160 68 L224 134 L194 234 L126 234 L96 134 Z" fill="none" stroke="'+a+'" stroke-opacity=".45" stroke-width="1.4"/>'+
      '<path d="M160 68 L160 234 M96 134 L224 134" stroke="#fff" stroke-opacity=".14" stroke-width="1.1"/>',

      '<circle cx="160" cy="152" r="74" fill="none" stroke="url(#o'+u+')" stroke-width="32"/>'+
      '<circle cx="160" cy="152" r="90" fill="none" stroke="'+a+'" stroke-opacity=".3" stroke-width="1.2"/>'+
      '<circle cx="160" cy="152" r="58" fill="none" stroke="'+a+'" stroke-opacity=".3" stroke-width="1.2"/>',

      '<path d="M160 74 L228 112 L228 190 L160 228 L92 190 L92 112 Z" fill="url(#o'+u+')"/>'+
      '<path d="M160 74 L228 112 L160 150 L92 112 Z" fill="#fff" opacity=".12"/>'+
      '<path d="M160 150 L160 228 M92 112 L160 150 L228 112" stroke="'+a+'" stroke-opacity=".4" stroke-width="1.3" fill="none"/>'
    ][i % 4];

    var s =
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320">'+
        '<defs>'+
          '<linearGradient id="bg'+u+'" x1="0" y1="0" x2="0" y2="1">'+
            '<stop offset="0%" stop-color="'+b+'"/><stop offset="60%" stop-color="#0b0f10"/>'+
            '<stop offset="100%" stop-color="#07090a"/></linearGradient>'+
          '<radialGradient id="key'+u+'" cx="32%" cy="20%" r="70%">'+
            '<stop offset="0%" stop-color="'+a+'" stop-opacity=".26"/>'+
            '<stop offset="100%" stop-color="'+a+'" stop-opacity="0"/></radialGradient>'+
          '<radialGradient id="o'+u+'" cx="35%" cy="27%" r="76%">'+
            '<stop offset="0%" stop-color="#ffffff" stop-opacity=".8"/>'+
            '<stop offset="32%" stop-color="'+a+'"/><stop offset="100%" stop-color="'+b+'"/></radialGradient>'+
          '<radialGradient id="sh'+u+'" cx="50%" cy="50%" r="50%">'+
            '<stop offset="0%" stop-color="#000" stop-opacity=".8"/>'+
            '<stop offset="100%" stop-color="#000" stop-opacity="0"/></radialGradient>'+
          '<filter id="n'+u+'"><feTurbulence baseFrequency=".85" numOctaves="3"/>'+
            '<feColorMatrix values="0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .1 0"/></filter>'+
        '</defs>'+
        '<rect width="320" height="320" fill="url(#bg'+u+')"/>'+
        '<rect width="320" height="320" fill="url(#key'+u+')"/>'+
        '<g stroke="'+a+'" stroke-opacity=".085" stroke-width="1">'+
          '<path d="M0 252 H320 M0 278 H320 M0 304 H320"/>'+
          '<path d="M48 240 L-16 320 M160 240 L160 320 M272 240 L336 320"/></g>'+
        '<ellipse cx="160" cy="250" rx="88" ry="18" fill="url(#sh'+u+')"/>'+
        shape+
        '<path d="M0 0 H320 V92 Q160 38 0 92 Z" fill="#fff" opacity=".03"/>'+
        '<rect width="320" height="320" filter="url(#n'+u+')" opacity=".5"/>'+
      '</svg>';
    return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
  }

  function fallbackPool(){
    var out = [], types = ['model','image','video'], aspects = ['square','portrait','landscape'];
    for (var i=0;i<16;i++){
      out.push({ id:'fb-'+i, type:types[i%3], thumbnail:svgTile(i),
                 prompt:FALLBACK_PROMPTS[i % FALLBACK_PROMPTS.length],
                 aspect:aspects[(i*2)%3], _fallback:true });
    }
    return out;
  }

  function normalize(cards){
    return (cards||[]).map(function(c){
      return {
        id       : c.id,
        type     : /vid/i.test(c.type) ? 'video' : /ima?g/i.test(c.type) ? 'image' : 'model',
        thumbnail: c.thumb_preview || c.thumb_url || c.thumbnail || c.thumbnail_url || '',
        video_url: c.video_url || '', glb_url: c.glb_url || '', image_url: c.image_url || '',
        prompt   : c.prompt || c.title || '',
        aspect   : c.aspect || 'square'
      };
    }).filter(function(c){ return c.thumbnail; });
  }

  function readWarmCache(){
    try{
      var raw = localStorage.getItem(CFG.CACHE_KEY);
      if(!raw) return null;
      var o = JSON.parse(raw);
      var cards = normalize(o.cards || (o.data && o.data.cards));
      return cards.length ? cards : null;
    }catch(e){ return null; }
  }

  function fetchFeed(){
    var ctl = ('AbortController' in window) ? new AbortController() : null;
    var t = setTimeout(function(){ if (ctl) ctl.abort(); }, CFG.FEED_TIMEOUT);
    var url = CFG.FEED_URL + '?type=all&mix=balanced&shuffle=true&limit=' + CFG.FEED_LIMIT;
    return fetch(url, ctl ? { signal: ctl.signal } : {})
      .then(function(r){
        if(!r.ok) throw new Error('HTTP '+r.status);
        if((r.headers.get('content-type')||'').indexOf('json') === -1) throw new Error('non-JSON feed');
        return r.json();
      })
      .then(function(d){
        var cards = normalize(d.cards);
        if(!cards.length) throw new Error('empty feed');
        return cards;
      })
      .then(function(v){ clearTimeout(t); return v; },
            function(e){ clearTimeout(t); throw e; });
  }

  // ================================================================== LAYOUT
  function rnd(seed){ var x = Math.sin(seed*12.9898)*43758.5453; return x - Math.floor(x); }

  /* No headline keep-out on this page — the stage is genuinely empty, so the
     composition uses the whole area. Over-generate a jittered grid, then
     farthest-point sample; a random subset leaves visible dead zones. */
  /* On a tall, narrow stage the creation dock stacks into one column and eats
     the top ~40%, so the usable band is only what is left underneath. Spreading
     over the full height there just parks cards under the mask. */
  function bandFor(w,h){
    return (w / Math.max(1,h)) < 0.90 ? { y0:0.40, y1:0.98 } : { y0:0.03, y1:0.97 };
  }

  function layout(count, w, h){
    var band = bandFor(w,h);
    var bh = h * (band.y1 - band.y0);
    var aspect = w / Math.max(1,bh);
    var over = count * 1.9;
    var cols = Math.max(3, Math.round(Math.sqrt(over * aspect)));
    var rows = Math.max(3, Math.ceil(over / cols));
    var cells = [];
    for (var r=0;r<rows;r++){
      for (var c=0;c<cols;c++){
        var i = r*cols + c;
        var ny = (r + .5 + (rnd(i+7.3) - .5) * 0.66) / rows;
        cells.push({
          i:i, k:rnd(i+13.7),
          x:(c + .5 + (rnd(i+1)   - .5) * 0.66) / cols,
          y:band.y0 + ny * (band.y1 - band.y0)
        });
      }
    }

    var chosen = [], pickIdx = 0;
    for (var s=1;s<cells.length;s++) if (cells[s].k > cells[pickIdx].k) pickIdx = s;
    if (!cells.length) return [];
    chosen.push(cells.splice(pickIdx,1)[0]);
    while (chosen.length < count && cells.length){
      var best = 0, bestD = -1;
      for (var m=0;m<cells.length;m++){
        var md = Infinity;
        for (var n=0;n<chosen.length;n++){
          var dx = cells[m].x - chosen[n].x, dy = cells[m].y - chosen[n].y;
          var dd = dx*dx + dy*dy;
          if (dd < md) md = dd;
        }
        if (md > bestD){ bestD = md; best = m; }
      }
      chosen.push(cells.splice(best,1)[0]);
    }

    var mid0 = (band.y0 + band.y1) / 2, half = (band.y1 - band.y0) / 2;
    return chosen.map(function(c){
      /* Bias the near tier toward the middle of the band: its top and bottom
         are masked out under the dock and the command bar, so a big card there
         would only ever be seen as a fading sliver. */
      var mid  = 1 - Math.min(1, Math.abs(c.y - mid0) / half);
      var roll = rnd(c.i+3.1);
      var tier = roll < 0.30 + mid * 0.34 ? 2 : roll < 0.72 ? 1 : 0;
      return { x:Math.max(0.05,Math.min(0.95,c.x)),
               y:Math.max(0.04,Math.min(0.96,c.y)), tier:tier, seed:c.i };
    });
  }

  /* Density from the CONTAINER, not the viewport — the stage is the full grid
     and its height changes with the header, dock and command bar. */
  function densityFor(w, h, mode){
    var base;
    if      (w < 480)  base = 12;
    else if (w < 760)  base = 15;
    else if (w < 1100) base = 18;
    else if (w < 1500) base = 22;
    else               base = 26;
    if (h < 460) base = Math.round(base * 0.72);
    if (mode === 'calm') base = Math.round(base * 0.62);
    if (mode === 'rich') base = Math.round(base * 1.4);
    return Math.max(5, Math.min(38, base));
  }

  function baseCardWidth(w, h, count){
    var band = bandFor(w,h);
    /* size against the band actually used, not the full stage — otherwise the
       mobile cards come out desktop-sized and overlap into a pile */
    var per = Math.sqrt((w * h * (band.y1 - band.y0)) / Math.max(1,count));
    return Math.max(w < 560 ? 68 : 84, Math.min(215, per * 0.60));
  }

  // ================================================================== RENDER
  function esc(s){
    return String(s||'').replace(/[&<>"]/g,function(m){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]; });
  }

  function fillCard(btn, asset){
    var t = asset.type;
    btn.style.setProperty('--ar', ASPECTS[asset.aspect] || 1);
    btn.setAttribute('aria-label',
      (t==='video'?'Video':t==='image'?'Image':'3D model')+': '+(asset.prompt||'Untitled creation'));
    btn.dataset.assetId = asset.id;
    btn.dataset.assetType = t;
    btn.innerHTML =
      '<img src="'+esc(asset.thumbnail)+'" alt="" loading="lazy" decoding="async"/>'+
      '<span class="af__chip is-'+t+'">'+ICON[t]+'<span>'+t+'</span></span>'+
      '<span class="af__cap">'+esc(asset.prompt||'Untitled creation')+'</span>';
    btn.firstChild.addEventListener('error', function(){
      var s = btn.closest('.af__slot'); if (s) s.style.display = 'none';
    }, { once:true });
  }

  function build(){
    if (destroyed || !fieldEl || !root) return;
    var w = root.clientWidth, h = root.clientHeight;
    if (!w || !h) return;

    /* The grid box can run past the bottom of the viewport (see --af-overflow
       in asset-stage.css). Measure it so the bottom fade is anchored to what
       the user can actually see, not to the grid's nominal height. */
    var rect = root.getBoundingClientRect();
    var over = Math.max(0, Math.round(rect.bottom - (window.innerHeight || rect.bottom)));
    root.style.setProperty('--af-overflow', over + 'px');

    var count = Math.min(densityFor(w,h,CFG.DENSITY), pool.length ? pool.length * 2 : 1);
    var spots = layout(count, w, h);
    var bw    = baseCardWidth(w,h,count);

    fieldEl.textContent = '';
    slots = spots.map(function(sp, i){
      var tier = TIERS[sp.tier], asset = pool[i % pool.length];

      var slot = document.createElement('div');
      slot.className = 'af__slot';
      slot.style.setProperty('--x', (sp.x*100).toFixed(2)+'%');
      slot.style.setProperty('--y', (sp.y*100).toFixed(2)+'%');
      slot.style.setProperty('--w', Math.round(bw * tier.s)+'px');
      slot.style.setProperty('--o', tier.o);
      slot.style.setProperty('--blur', tier.blur+'px');
      slot.style.setProperty('--par', tier.par);
      slot.style.setProperty('--z', tier.z);

      var flo = document.createElement('div');
      flo.className = 'af__float';
      flo.style.setProperty('--drift', DRIFTS[Math.floor(rnd(sp.seed+11)*DRIFTS.length)]);
      flo.style.setProperty('--dur', (8 + rnd(sp.seed+21)*10).toFixed(2)+'s');
      flo.style.setProperty('--delay', '-'+(rnd(sp.seed+31)*14).toFixed(2)+'s');

      var btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'af__card';
      btn.style.setProperty('--shy', tier.shy+'px');
      btn.style.setProperty('--shb', tier.shb+'px');
      fillCard(btn, asset);

      flo.appendChild(btn); slot.appendChild(flo); fieldEl.appendChild(slot);
      return { el:slot, btn:btn, spot:sp };
    });

    requestAnimationFrame(function(){ root.style.setProperty('--af-in','1'); });
  }

  // ================================================================= SHUFFLE
  function shuffleTick(){
    if (destroyed || still || document.hidden || !slots.length || !pool.length) return;
    var n = Math.min(window.innerWidth < 760 ? 1 : CFG.SHUFFLE_COUNT, slots.length);
    for (var k=0;k<n;k++){
      (function(delay){
        var s = slots[Math.floor(Math.random()*slots.length)];
        setTimeout(function(){
          if (destroyed || !s || !s.el.isConnected) return;
          s.el.classList.add('is-swapping');
          setTimeout(function(){
            if (destroyed || !s.el.isConnected) return;
            cursor = (cursor + 1 + Math.floor(Math.random()*3)) % pool.length;
            fillCard(s.btn, pool[cursor]);
            /* re-jitter inside the same cell: the composition breathes, but
               nothing ever teleports across the stage */
            var nx = Math.max(0.05, Math.min(0.95, s.spot.x + (Math.random()-.5)*0.05));
            var ny = Math.max(0.06, Math.min(0.94, s.spot.y + (Math.random()-.5)*0.05));
            s.spot.x = nx; s.spot.y = ny;
            s.el.style.setProperty('--x',(nx*100).toFixed(2)+'%');
            s.el.style.setProperty('--y',(ny*100).toFixed(2)+'%');
            s.el.classList.remove('is-swapping');
          }, 450);
        }, delay);
      })(k * 340);
    }
  }

  function reshuffleAll(){
    if (!slots.length || !pool.length) return;
    slots.forEach(function(s,i){
      setTimeout(function(){
        if (destroyed || !s.el.isConnected) return;
        s.el.classList.add('is-swapping');
        setTimeout(function(){
          cursor = (cursor+1) % pool.length;
          fillCard(s.btn, pool[cursor]);
          s.el.classList.remove('is-swapping');
        }, 380);
      }, i*40);
    });
  }

  // ================================================================ PARALLAX
  function onPointer(e){
    if (still) return;
    pendingEvt = e;
    if (rafId) return;
    rafId = requestAnimationFrame(function(){
      rafId = null;
      if (!pendingEvt || destroyed) return;
      var r = root.getBoundingClientRect();
      var nx = ((pendingEvt.clientX - r.left) / r.width  - .5) * 2;
      var ny = ((pendingEvt.clientY - r.top ) / r.height - .5) * 2;
      root.style.setProperty('--afx', (-nx * CFG.PARALLAX_MAX).toFixed(1)+'px');
      root.style.setProperty('--afy', (-ny * CFG.PARALLAX_MAX * 0.7).toFixed(1)+'px');
      pendingEvt = null;
    });
  }
  function onLeave(){
    root.style.setProperty('--afx','0px');
    root.style.setProperty('--afy','0px');
  }

  // =============================================================== LIFECYCLE
  function startMotion(){ if (!shuffleTimer && !still && !destroyed) shuffleTimer = setInterval(shuffleTick, CFG.SHUFFLE_MS); }
  function stopMotion(){ clearInterval(shuffleTimer); shuffleTimer = null; }

  function setStill(v){
    still = v;
    root.classList.toggle('af--still', v);
    if (v) { stopMotion(); onLeave(); } else { startMotion(); }
  }

  function openAsset(asset){
    if (window.TimrXInspire && typeof window.TimrXInspire.loadIntoViewer === 'function'){
      try {
        document.body.classList.add('ws-viewer-open');
        window.TimrXInspire.loadIntoViewer(asset);
        return;
      } catch(e){}
    }
    root.dispatchEvent(new CustomEvent('timrx:asset-stage-open', { bubbles:true, detail:asset }));
  }

  // ==================================================================== MOUNT
  function mount(){
    root = document.getElementById('wsStage');
    if (!root) return;
    fieldEl = root.querySelector('.ws-stage__field');
    if (!fieldEl) return;

    var reduce  = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var lowCore = (navigator.hardwareConcurrency || 8) <= 4;
    if (reduce || lowCore) setStill(true);

    /* The stage is pointer-events:none so it never eats clicks meant for the
       dock; the parallax listener therefore has to live on the workspace. */
    var pointerHost = document.querySelector('.timrx-3dprint') || document.body;
    if (window.matchMedia('(hover:hover) and (pointer:fine)').matches){
      pointerHost.addEventListener('pointermove', onPointer, { passive:true });
      pointerHost.addEventListener('pointerleave', onLeave,  { passive:true });
    }

    if ('IntersectionObserver' in window){
      io = new IntersectionObserver(function(es){
        if (es[0].isIntersecting) startMotion(); else stopMotion();
      }, { threshold:0.02 });
      io.observe(root);
    } else startMotion();

    document.addEventListener('visibilitychange', function(){
      if (document.hidden) stopMotion(); else startMotion();
    });

    if ('ResizeObserver' in window){
      ro = new ResizeObserver(function(){
        clearTimeout(resizeDeb); resizeDeb = setTimeout(build, 190);
      });
      ro.observe(root);
    } else {
      window.addEventListener('resize', function(){
        clearTimeout(resizeDeb); resizeDeb = setTimeout(build, 190);
      });
    }

    fieldEl.addEventListener('click', function(e){
      var btn = e.target.closest('.af__card'); if(!btn) return;
      var id = btn.dataset.assetId, hit = null;
      for (var i=0;i<pool.length;i++) if (String(pool[i].id) === id) { hit = pool[i]; break; }
      openAsset(hit || { id:id, type:btn.dataset.assetType });
    });

    var warm = readWarmCache();
    pool = warm || fallbackPool();
    build();
    startMotion();

    fetchFeed().then(function(cards){
      if (destroyed) return;
      pool = cards; cursor = 0; build();
    }).catch(function(err){
      console.warn('[AssetStage] live feed unavailable, using',
        warm ? 'warm Inspire cache' : 'fallback tiles', '·', err && err.message);
    });
  }

  function destroy(){
    if (destroyed) return;
    destroyed = true; stopMotion();
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    if (io) io.disconnect();
    if (ro) ro.disconnect();
    clearTimeout(resizeDeb);
    if (root){ root.style.display = 'none'; fieldEl.textContent = ''; }
    slots = [];
  }

  window.TimrXAssetStage = {
    mount:mount, destroy:destroy, rebuild:build, reshuffle:reshuffleAll,
    setStill:setStill, setDensity:function(d){ CFG.DENSITY = d; build(); }
  };

  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', mount, { once:true });
  } else { mount(); }
})();


/* ============================ PROTOTYPE CONTROLS (does not ship) ========= */
document.addEventListener('DOMContentLoaded', function(){
  var AS = window.TimrXAssetStage;
  var toast = document.getElementById('protoToast'), tt;
  function say(m){ toast.textContent=m; toast.classList.add('show');
    clearTimeout(tt); tt=setTimeout(function(){toast.classList.remove('show')},2400); }

  document.querySelectorAll('[data-den]').forEach(function(b){
    b.addEventListener('click', function(){
      document.querySelectorAll('[data-den]').forEach(function(x){x.classList.remove('on')});
      b.classList.add('on'); AS.setDensity(b.dataset.den);
    });
  });

  var stillOn=false;
  document.getElementById('btnStill').addEventListener('click', function(){
    stillOn=!stillOn; this.classList.toggle('on',stillOn); AS.setStill(stillOn);
    say(stillOn ? 'Reduced motion — still collage' : 'Motion on');
  });
  document.getElementById('btnShuffle').addEventListener('click', function(){ AS.reshuffle(); });

  var panelOn=false;
  document.getElementById('btnPanel').addEventListener('click', function(){
    panelOn=!panelOn; this.classList.toggle('on',panelOn);
    document.body.classList.toggle('ws-panel-open',panelOn);
    say(panelOn ? 'ws-panel-open → stage recedes behind the sheet' : 'sheet closed → stage returns');
  });
  var viewerOn=false;
  document.getElementById('btnViewer').addEventListener('click', function(){
    viewerOn=!viewerOn; this.classList.toggle('on',viewerOn);
    document.body.classList.toggle('ws-viewer-open',viewerOn);
    say(viewerOn ? 'ws-viewer-open → stage hidden, viewer owns the row' : 'viewer closed → stage returns');
  });

  document.getElementById('wsStage').addEventListener('timrx:asset-stage-open', function(e){
    say('open → ' + (e.detail.type||'asset') + ': ' + String(e.detail.prompt||e.detail.id).slice(0,46));
  });
});
</script>
</body>
