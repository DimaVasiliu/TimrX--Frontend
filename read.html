<!DOCTYPE html>
<html lang="en" class="read-page">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Read — TimrX</title>
  <meta name="description" content="Read blog posts on TimrX — web development, 3D, and creative tech." />
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" id="canonicalLink" href="https://timrx.live/blogs" />

  <!-- Open Graph (updated dynamically per post) -->
  <meta property="og:type" content="article" />
  <meta property="og:url" id="ogUrl" content="https://timrx.live/blogs" />
  <meta property="og:title" id="ogTitle" content="TimrX Blog" />
  <meta property="og:description" id="ogDesc" content="Read blog posts on TimrX — web development, 3D, and creative tech." />
  <meta property="og:image" id="ogImage" content="https://timrx.live/img/blogs.png" />
  <meta property="og:site_name" content="TimrX" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" id="twTitle" content="TimrX Blog" />
  <meta name="twitter:description" id="twDesc" content="Read blog posts on TimrX — web development, 3D, and creative tech." />
  <meta name="twitter:image" id="twImage" content="https://timrx.live/img/blogs.png" />

  <!-- Favicon (Blog section) -->
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-blogs-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-blogs-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/img/favicon-blogs-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="read.css"/>

</head>
<body class="read-page">
  <div id="progressBar" class="progress-bar" aria-hidden="true"></div>

  <!-- MINIMAL HEADER -->
  <header class="read-header" aria-label="Site header">
    <a class="read-brand" href="index.html" aria-label="Home">
      <span class="b-tim">Timr</span><span class="b-x">X</span>
    </a>
    <a class="read-nav-link" href="blogs.html">← Back to Blogs</a>
  </header>

  <main class="read-main">
    <!-- Hero Section -->
    <header class="post-hero">
      <div class="hero-noise" aria-hidden="true"></div>
      <div class="hero-gradient" aria-hidden="true"></div>
      <div class="post-hero-inner">
        <div class="post-category">
          <span id="heroCap" class="category-pill">—</span>
        </div>
        <h1 id="postTitle" class="post-title">Loading…</h1>
        <p id="postExcerpt" class="post-excerpt"></p>
      </div>
    </header>

    <!-- Cover Image + Meta -->
    <section class="post-cover container">
      <figure class="cover-figure">
        <img id="heroImg" alt="cover"/>
      </figure>
      <div class="post-meta">
        <img class="avatar" id="authorAvatar" src="img/dima.jpg" alt="Author"/>
        <div class="meta-info">
          <div class="byline"><strong id="postAuthor">—</strong></div>
          <div class="meta-details">
            <time id="postDate">—</time>
            <span class="meta-sep">•</span>
            <span id="readTime">— min read</span>
          </div>
        </div>
        <button type="button" id="shareBtn" class="share-btn" aria-label="Share this post">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
            <polyline points="16 6 12 2 8 6"/>
            <line x1="12" y1="2" x2="12" y2="15"/>
          </svg>
        </button>
      </div>
    </section>

    <!-- Content Layout -->
    <div class="container post-layout">
      <aside class="post-toc">
        <div class="toc-card">
          <h3>Contents</h3>
          <nav id="tocList"></nav>
        </div>
      </aside>
      <article id="article" class="post-article"></article>
    </div>

    <!-- Engagement Section -->
    <section class="engagement-section container">
      <div class="engagement-bar">
        <div class="engagement-actions">
          <button type="button" id="likeBtn" class="engage-btn like-btn" aria-label="Like this post">
            <svg class="heart-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
            <span id="likeCount">0</span>
          </button>
          <button type="button" id="shareDropdownBtn" class="engage-btn share-dropdown-btn" aria-label="Share options">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="18" cy="5" r="3"/>
              <circle cx="6" cy="12" r="3"/>
              <circle cx="18" cy="19" r="3"/>
              <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
              <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
            </svg>
            <span>Share</span>
          </button>
          <div id="shareOptions" class="share-options hidden">
            <button type="button" data-share="twitter" class="share-option">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
              <span>Twitter</span>
            </button>
            <button type="button" data-share="linkedin" class="share-option">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
              <span>LinkedIn</span>
            </button>
            <button type="button" data-share="facebook" class="share-option">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
              <span>Facebook</span>
            </button>
            <button type="button" data-share="copy" class="share-option">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              <span>Copy Link</span>
            </button>
          </div>
        </div>
        <div class="engagement-info">
          <span id="viewCount" class="view-count">— views</span>
        </div>
      </div>

      <!-- Comments Section -->
      <div class="comments-section">
        <div class="comments-header">
          <h3>Comments <span id="commentCount" class="comment-badge">0</span></h3>
        </div>

        <form id="commentForm" class="comment-form">
          <div class="comment-input-group">
            <input type="text" id="commenterName" placeholder="Your name" required />
            <textarea id="commentText" placeholder="Write a comment..." rows="3" required></textarea>
          </div>
          <button type="submit" class="comment-submit-btn">
            <span>Post Comment</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="22" y1="2" x2="11" y2="13"/>

          </button>

        <div id="commentsList" class="comments-list">
          <!-- Comments will be loaded here -->
        </div>

        <p id="noComments" class="no-comments">Be the first to comment on this post.</p>
      </div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer class="read-footer">
    <div class="container foot">
      <span>© <span id="year"></span> TimrX / Dima Vasiliu</span>
      <nav class="foot-nav">

      </div>

<!-- Frontend/read.html - Dual format support (blocks + markdown) -->
<script>
  const qs = s => document.querySelector(s);
  const qsa = s => Array.from(document.querySelectorAll(s));
  const API_BASE = (localStorage.getItem('BLOGS_API_BASE') || 'https://blog.timrx.live').replace(/\/$/, '');
  const API = API_BASE + '/api';
  function getParam(name){ return new URLSearchParams(location.search).get(name); }
  function md(s){ return marked.parse(s || ''); }

  // API warmup - wake up server early with lightweight request (fire and forget)
  (function warmupAPI() {
    fetch(`${API}/posts?page=1&size=1`, { method: 'GET', cache: 'no-store' }).catch(() => {});
  })();

  // Cache configuration
  const CACHE_EXPIRY = 10 * 60 * 1000; // 10 minutes for individual posts

  function getPostCache(slug) {
    try {
      const cached = sessionStorage.getItem(`timrx_post_${slug}`);
      if (!cached) return null;
      const { data, timestamp } = JSON.parse(cached);
      return { data, isStale: Date.now() - timestamp > CACHE_EXPIRY };
    } catch { return null; }
  }

  function setPostCache(slug, data) {
    try {
      sessionStorage.setItem(`timrx_post_${slug}`, JSON.stringify({ data, timestamp: Date.now() }));
    } catch {}
  }

  // Show loading skeleton
  function showPostSkeleton() {
    qs('#postTitle').classList.add('skeleton-text');
    qs('#postExcerpt').classList.add('skeleton-text');
    qs('#article').innerHTML = `
      <div class="skeleton-content">
        <div class="skeleton-line skeleton-heading"></div>
        <div class="skeleton-line skeleton-paragraph"></div>
        <div class="skeleton-line skeleton-paragraph"></div>
        <div class="skeleton-line skeleton-paragraph short"></div>
        <div class="skeleton-line skeleton-heading"></div>
        <div class="skeleton-line skeleton-paragraph"></div>
        <div class="skeleton-line skeleton-paragraph"></div>
      </div>
    `;
  }

  function hidePostSkeleton() {
    qs('#postTitle').classList.remove('skeleton-text');
    qs('#postExcerpt').classList.remove('skeleton-text');
  }

  // Year in footer
  (function(){ const y=qs('#year'); if(y) y.textContent = new Date().getFullYear(); })();

  // Render Editor.js blocks to HTML
  function renderBlocks(blocksData) {
    let data;
    try {
      data = typeof blocksData === 'string' ? JSON.parse(blocksData) : blocksData;
    } catch {
      return '<p>Error parsing content</p>';
    }
    if (!data || !data.blocks) return '';

    return data.blocks.map(block => {
      const d = block.data || {};
      switch (block.type) {
        case 'paragraph':
          return `<p>${d.text || ''}</p>`;
        case 'header':
          const lvl = d.level || 2;
          return `<h${lvl}>${d.text || ''}</h${lvl}>`;
        case 'list':
          const tag = d.style === 'ordered' ? 'ol' : 'ul';
          const items = (d.items || []).map(item => {
            const text = typeof item === 'string' ? item : (item.content || '');
            return `<li>${text}</li>`;
          }).join('');
          return `<${tag}>${items}</${tag}>`;
        case 'image':
          const url = d.file?.url || d.url || '';
          const cap = d.caption || '';
          return `<figure class="post-image"><img src="${url}" alt="${cap}"/>${cap ? `<figcaption>${cap}</figcaption>` : ''}</figure>`;
        case 'code':
          const code = (d.code || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          return `<pre><code>${code}</code></pre>`;
        case 'quote':
          const quote = d.text || '';
          const author = d.caption || '';
          return `<blockquote><p>${quote}</p>${author ? `<cite>— ${author}</cite>` : ''}</blockquote>`;
        case 'delimiter':
          return '<hr class="delimiter"/>';
        case 'checklist':
          const checks = (d.items || []).map(item => {
            const checked = item.checked ? 'checked' : '';
            return `<li class="checklist-item ${checked}"><span class="checkbox"></span>${item.text || ''}</li>`;
          }).join('');
          return `<ul class="checklist">${checks}</ul>`;
        case 'warning':
          return `<div class="warning-block"><strong>${d.title || 'Warning'}</strong><p>${d.message || ''}</p></div>`;
        case 'product':
          const pName = d.name || 'Product';
          const pDesc = d.description || '';
          const pUrl = d.url || '#';
          const pCta = d.cta || 'View on Amazon';
          return `<div class="product-block">
            <div class="product-content">
              <div class="product-badge">Recommended</div>
              <h4 class="product-name">${pName}</h4>
              <p class="product-desc">${pDesc}</p>
              <a href="${pUrl}" target="_blank" rel="noopener sponsored" class="product-cta">${pCta} <span class="arrow">→</span></a>
            </div>
          </div>`;
        default:
          return '';
      }
    }).join('\n');
  }

  function renderPost(p) {
    qs('#postTitle').textContent = p.title;
    qs('#postExcerpt').textContent = p.excerpt || '';
    qs('#postAuthor').textContent = p.author || 'TimrX';
    qs('#postDate').textContent = new Date(p.created_at || Date.now()).toLocaleDateString('en-GB',{month:'short',year:'numeric'});
    const img = p.cover_url || 'https://images.unsplash.com/photo-1498050108023-c5249f4df085?q=80&w=1600&auto=format&fit=crop';
    qs('#heroImg').src = img;
    qs('#heroCap').textContent = (p.tags || '').split(',')[0] || p.type || 'Post';

    // Set author avatar
    if (p.author_avatar) {
      qs('#authorAvatar').src = p.author_avatar;
    }

    // SEO: Update canonical URL to /blog/<slug>
    const canonicalUrl = `https://timrx.live/blog/${p.slug}`;
    qs('#canonicalLink').href = canonicalUrl;

    // SEO: Update page title and meta description
    document.title = `${p.title} — TimrX`;
    const metaDesc = qs('meta[name="description"]');
    if (metaDesc && p.excerpt) {
      metaDesc.content = p.excerpt;
    }

    // SEO: Update Open Graph and Twitter meta tags
    const ogImage = p.cover_url || 'https://timrx.live/img/blogs.png';
    qs('#ogUrl').content = canonicalUrl;
    qs('#ogTitle').content = p.title;
    qs('#ogDesc').content = p.excerpt || '';
    qs('#ogImage').content = ogImage;
    qs('#twTitle').content = p.title;
    qs('#twDesc').content = p.excerpt || '';
    qs('#twImage').content = ogImage;

    // Dual-format rendering: blocks or markdown
    const format = p.content_format || 'markdown';
    if (format === 'blocks' && p.content_blocks) {
      qs('#article').innerHTML = renderBlocks(p.content_blocks);
    } else {
      qs('#article').innerHTML = md(p.content_md);
    }

    // Build table of contents
    const toc = qs('#tocList');
    toc.innerHTML = '';
    const heads = qsa('.post-article h2, .post-article h3');
    const frag = document.createDocumentFragment();
    heads.forEach(h => {
      if (!h.id) h.id = h.textContent.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-');
      const a = document.createElement('a');
      a.href = '#' + h.id;
      a.textContent = h.textContent;
      a.className = h.tagName === 'H3' ? 'toc-l2' : 'toc-l1';
      frag.appendChild(a);
    });
    toc.appendChild(frag);

    const words = qs('#article').innerText.trim().split(/\s+/).length;
    qs('#readTime').textContent = Math.max(1, Math.round(words/200)) + ' min read';
    hidePostSkeleton();
  }

  async function fetchPost(slug) {
    const r = await fetch(`${API}/post/${encodeURIComponent(slug)}`);
    if (!r.ok) return null;
    return r.json();
  }

  async function load(){
    const slugParam = getParam('slug');
    if (!slugParam) {
      qs('#postTitle').textContent = 'Post not found';
      return;
    }

    // Check cache first
    const cached = getPostCache(slugParam);

    if (cached && cached.data) {
      // Render cached content immediately
      renderPost(cached.data);

      // If stale, refresh in background
      if (cached.isStale) {
        fetchPost(slugParam).then(freshData => {
          if (freshData) {
            setPostCache(slugParam, freshData);
            renderPost(freshData);
          }
        }).catch(() => {});
      }
    } else {
      // No cache - show skeleton and fetch
      showPostSkeleton();
      const p = await fetchPost(slugParam);
      if (!p) {
        qs('#postTitle').textContent = 'Post not found';
        hidePostSkeleton();
        return;
      }
      setPostCache(slugParam, p);
      renderPost(p);
    }
  }

  function progress(){
    const bar = qs('#progressBar'); const a=qs('#article'); if(!a) return;
    const total = a.scrollHeight - innerHeight; const y = Math.min(total, Math.max(0, scrollY - (a.offsetTop - 80)));
    const p = total>0 ? y/total : 0; bar.style.transform = 'scaleX('+p+')';
  }

  // Share functionality (header button)
  qs('#shareBtn').addEventListener('click', async () => {
    const title = qs('#postTitle').textContent;
    const url = window.location.href;
    if (navigator.share) {
      try {
        await navigator.share({ title, url });
      } catch {}
    } else {
      navigator.clipboard.writeText(url);
      showToast('Link copied to clipboard!');
    }
  });

  // Toast notification
  function showToast(message) {
    const existing = qs('.toast-notification');
    if (existing) existing.remove();

    const toast = document.createElement('div');
    toast.className = 'toast-notification';
    toast.textContent = message;
    document.body.appendChild(toast);
    setTimeout(() => toast.classList.add('show'), 10);
    setTimeout(() => {
      toast.classList.remove('show');
      setTimeout(() => toast.remove(), 300);
    }, 2500);
  }

  // ===== REAL ENGAGEMENT TRACKING =====
  const postSlug = getParam('slug');
  const likeBtn = qs('#likeBtn');
  const likeCount = qs('#likeCount');
  const viewCount = qs('#viewCount');

  // Generate a fingerprint for tracking unique users
  function getUserFingerprint() {
    let fp = localStorage.getItem('timrx_fingerprint');
    if (!fp) {
      fp = 'fp_' + Math.random().toString(36).substr(2, 9) + Date.now().toString(36);
      localStorage.setItem('timrx_fingerprint', fp);
    }
    return fp;
  }

  // Track page view
  async function trackView() {
    if (!postSlug) return;
    try {
      await fetch(`${API}/post/${encodeURIComponent(postSlug)}/view`, { method: 'POST' });
    } catch (e) {
      console.log('[Engagement] View tracking failed:', e);
    }
  }

  // Load engagement stats
  async function loadEngagement() {
    if (!postSlug) return;
    try {
      const r = await fetch(`${API}/post/${encodeURIComponent(postSlug)}/engagement`);
      const data = await r.json();
      if (data.ok) {
        likeCount.textContent = data.likes || 0;
        viewCount.textContent = `${data.views || 0} views`;
      }
    } catch (e) {
      console.log('[Engagement] Failed to load stats:', e);
    }
  }

  // Check if user has liked
  async function checkIfLiked() {
    if (!postSlug) return;
    const fp = getUserFingerprint();
    try {
      const r = await fetch(`${API}/post/${encodeURIComponent(postSlug)}/liked?fingerprint=${encodeURIComponent(fp)}`);
      const data = await r.json();
      if (data.liked) {
        likeBtn.classList.add('liked');
      }
    } catch (e) {
      console.log('[Engagement] Like check failed:', e);
    }
  }

  // Toggle like
  likeBtn.addEventListener('click', async () => {
    if (!postSlug) return;
    const fp = getUserFingerprint();

    // Optimistic UI update
    const wasLiked = likeBtn.classList.contains('liked');
    likeBtn.classList.toggle('liked');
    const currentCount = parseInt(likeCount.textContent) || 0;
    likeCount.textContent = wasLiked ? Math.max(0, currentCount - 1) : currentCount + 1;

    // Animate heart
    if (!wasLiked) {
      likeBtn.style.transform = 'scale(1.2)';
      setTimeout(() => likeBtn.style.transform = '', 150);
    }

    try {
      const r = await fetch(`${API}/post/${encodeURIComponent(postSlug)}/like`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fingerprint: fp })
      });
      const data = await r.json();
      if (data.ok) {
        likeCount.textContent = data.likes;
        if (data.liked) {
          likeBtn.classList.add('liked');
        } else {
          likeBtn.classList.remove('liked');
        }
      }
    } catch (e) {
      // Revert on error
      likeBtn.classList.toggle('liked');
      likeCount.textContent = currentCount;
      console.log('[Engagement] Like toggle failed:', e);
    }
  });

  // Engagement: Share dropdown
  const shareDropdownBtn = qs('#shareDropdownBtn');
  const shareOptions = qs('#shareOptions');

  shareDropdownBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    shareOptions.classList.toggle('hidden');
  });

  document.addEventListener('click', () => {
    shareOptions.classList.add('hidden');
  });

  shareOptions.addEventListener('click', (e) => {
    e.stopPropagation();
  });

  // Track share action
  async function trackShare() {
    if (!postSlug) return;
    try {
      await fetch(`${API}/post/${encodeURIComponent(postSlug)}/share`, { method: 'POST' });
    } catch (e) {
      console.log('[Engagement] Share tracking failed:', e);
    }
  }

  qsa('.share-option').forEach(btn => {
    btn.addEventListener('click', () => {
      const type = btn.dataset.share;
      const title = encodeURIComponent(qs('#postTitle').textContent);
      const url = encodeURIComponent(window.location.href);

      // Track the share
      trackShare();

      switch(type) {
        case 'twitter':
          window.open(`https://twitter.com/intent/tweet?text=${title}&url=${url}`, '_blank');
          break;
        case 'linkedin':
          window.open(`https://www.linkedin.com/sharing/share-offsite/?url=${url}`, '_blank');
          break;
        case 'facebook':
          window.open(`https://www.facebook.com/sharer/sharer.php?u=${url}`, '_blank');
          break;
        case 'copy':
          navigator.clipboard.writeText(window.location.href);
          showToast('Link copied to clipboard!');
          break;
      }
      shareOptions.classList.add('hidden');
    });
  });

  // ===== REAL COMMENTS SYSTEM =====
  const commentForm = qs('#commentForm');
  const commentsList = qs('#commentsList');
  const noComments = qs('#noComments');
  const commentCount = qs('#commentCount');

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function formatDate(dateStr) {
    const date = new Date(dateStr);
    const now = new Date();
    const diff = now - date;
    const mins = Math.floor(diff / 60000);
    const hours = Math.floor(diff / 3600000);
    const days = Math.floor(diff / 86400000);

    if (mins < 1) return 'Just now';
    if (mins < 60) return `${mins}m ago`;
    if (hours < 24) return `${hours}h ago`;
    if (days < 7) return `${days}d ago`;
    return date.toLocaleDateString('en-GB', { month: 'short', day: 'numeric' });
  }

  function renderCommentsUI(comments) {
    commentCount.textContent = comments.length;

    if (comments.length === 0) {
      commentsList.innerHTML = '';
      noComments.classList.remove('hidden');
      return;
    }

    noComments.classList.add('hidden');
    commentsList.innerHTML = comments.map(c => `
      <div class="comment-item">
        <div class="comment-avatar">${(c.author_name || 'A').charAt(0).toUpperCase()}</div>
        <div class="comment-body">
          <div class="comment-header">
            <span class="comment-author">${escapeHtml(c.author_name)}</span>
            <span class="comment-date">${formatDate(c.created_at)}</span>
          </div>
          <p class="comment-text">${escapeHtml(c.content)}</p>
        </div>
      </div>
    `).join('');
  }

  async function loadComments() {
    if (!postSlug) return;
    try {
      const r = await fetch(`${API}/post/${encodeURIComponent(postSlug)}/comments`);
      const data = await r.json();
      if (data.ok) {
        renderCommentsUI(data.comments || []);
      }
    } catch (e) {
      console.log('[Comments] Failed to load:', e);
      commentsList.innerHTML = '<p class="muted" style="text-align:center;padding:20px;">Failed to load comments</p>';
    }
  }

  commentForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = qs('#commenterName').value.trim();
    const content = qs('#commentText').value.trim();

    if (!name || !content) return;

    const submitBtn = commentForm.querySelector('.comment-submit-btn');
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span>Posting...</span>';

    try {
      const r = await fetch(`${API}/post/${encodeURIComponent(postSlug)}/comment`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, content })
      });
      const data = await r.json();

      if (data.ok) {
        qs('#commenterName').value = '';
        qs('#commentText').value = '';
        showToast('Comment posted!');
        // Reload comments to show the new one
        loadComments();
      } else {
        showToast(data.error || 'Failed to post comment');
      }
    } catch (e) {
      console.log('[Comments] Post error:', e);
      showToast('Failed to post comment');
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerHTML = '<span>Post Comment</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>';
    }
  });

  // Initialize engagement
  async function initEngagement() {
    // Track the view
    trackView();
    // Load engagement stats
    await loadEngagement();
    // Check if user has liked
    await checkIfLiked();
    // Load comments
    await loadComments();
  }

  window.addEventListener('scroll', progress, {passive:true});
  window.addEventListener('resize', progress);
  load().then(() => {
    initEngagement();
  });
</script>
</body>
</html>
