<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Read — TimrX</title>
  <link rel="stylesheet" href="styles.css"/>
  <link rel="stylesheet" href="read.css"/>
  <link rel="stylesheet" href="burger.css"/>
  <link rel="stylesheet" href="media/read.css"/>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div id="progressBar" class="progress-bar" aria-hidden="true"></div>

  <nav class="nav divider"><div class="container nav-inner">
    <a class="brand" id="brand" href="index.html" aria-label="Home">
      <span class="swap" id="brandTim" aria-label="TimrX">
        <span class="b-tim">Timr</span><span class="b-x">X</span>
      </span>
      <span class="swap out" id="brandDima" aria-label="Dima Vasiliu">
        <span class="b-dima">Dima</span> <span class="b-surname">Vasiliu</span>
      </span>
    </a>
    <div class="nav-links"><a href="blogs.html">BLOGS</a><a href="index.html#services">SERVICES</a></div>
    <a class="nav-cta" href="index.html#contact">CONTACT ME ↗</a>

    <!-- Burger button (2-line Apple style - mobile only) -->
    <button id="burgerBtn" aria-label="Open menu" aria-expanded="false">
      <div class="burger-icon">
        <span class="burger-line"></span>
        <span class="burger-line"></span>
      </div>
    </button>
  </div></nav>

  <!-- Burger overlay -->
  <div id="burgerOverlay"></div>

  <!-- Burger menu -->
  <nav id="burgerMenu" aria-label="Mobile menu">
    <div class="burger-menu__items">
      <a href="blogs.html" class="burger-menu__item">
        <span class="burger-menu__icon">📝</span>
        <span class="burger-menu__text">Blogs</span>
      </a>
      <a href="index.html" class="burger-menu__item">
        <span class="burger-menu__icon">🏠</span>
        <span class="burger-menu__text">Home</span>
      </a>
      <a href="index.html#services" class="burger-menu__item">
        <span class="burger-menu__icon">⚙️</span>
        <span class="burger-menu__text">Services</span>
      </a>
      <a href="index.html#contact" class="burger-menu__item burger-menu__item--emphasis">
        <span class="burger-menu__icon">✉️</span>
        <span class="burger-menu__text">Contact Me</span>
      </a>
    </div>
  </nav>

  <header class="post-hero">
    <figure class="hero-figure" data-parallax="0.25">
      <img id="heroImg" alt="cover"/>
      <figcaption id="heroCap">—</figcaption>
    </figure>
    <div class="container post-meta-wrap">
      <h1 id="postTitle" class="title-xl post-title">Loading…</h1>
      <p id="postExcerpt" class="muted post-sub"></p>
      <div class="post-meta">
        <img class="avatar" src="/TimrX/Frontend/img/dima.JPG" alt=""/>
        <div><div class="byline"><strong id="postAuthor">—</strong> • <time id="postDate">—</time></div>
        <div id="readTime" class="muted">— min read</div></div>
        <div class="post-share" style="margin-left:auto"><button id="shareBtn" class="btn small">Share</button></div>
      </div>
    </div>
  </header>

  <main class="container post-layout">
    <aside class="post-toc"><div class="toc-card"><h3>Contents</h3><nav id="tocList"></nav></div></aside>
    <article id="article" class="post-article"></article>
  </main>

  <footer><div class="container foot"><span>© 2025 TimrX / Dima Vasiliu</span></div></footer>

<!-- Frontend/read.html (ONLY the small JS change: API base resolution) -->
<script>
  const qs = s => document.querySelector(s);
  const qsa = s => Array.from(document.querySelectorAll(s));
  const API_BASE = (localStorage.getItem('BLOGS_API_BASE') || 'https://timrx-blogs-api-1.onrender.com').replace(/\/$/, '');
  const API = API_BASE + '/api';
  function getParam(name){ return new URLSearchParams(location.search).get(name); }
  function md(s){ return marked.parse(s || ''); }

  async function load(){
    const slug = getParam('slug'); if(!slug){ qs('#postTitle').textContent = 'Post not found'; return; }
    const r = await fetch(`${API}/post/${encodeURIComponent(slug)}`);
    if(!r.ok){ qs('#postTitle').textContent = 'Post not found'; return; }
    const p = await r.json();
    qs('#postTitle').textContent = p.title;
    qs('#postExcerpt').textContent = p.excerpt || '';
    qs('#postAuthor').textContent = p.author || 'TimrX';
    qs('#postDate').textContent = new Date(p.created_at || Date.now()).toLocaleDateString('en-GB',{month:'short',year:'numeric'});
    const img = p.cover_url || 'https://images.unsplash.com/photo-1498050108023-c5249f4df085?q=80&w=1600&auto=format&fit=crop';
    qs('#heroImg').src = img; qs('#heroCap').textContent = p.type || '';

    qs('#article').innerHTML = md(p.content_md);
    const heads = qsa('.post-article h2, .post-article h3'); const toc = qs('#tocList'); const frag=document.createDocumentFragment();
    heads.forEach(h=>{ if(!h.id) h.id=h.textContent.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-'); const a=document.createElement('a'); a.href='#'+h.id; a.textContent=h.textContent; a.className=h.tagName==='H3'?'toc-l2':'toc-l1'; frag.appendChild(a);});
    toc.appendChild(frag);

    const words = qs('#article').innerText.trim().split(/\s+/).length;
    qs('#readTime').textContent = Math.max(1, Math.round(words/200)) + ' min read';
  }

  function progress(){
    const bar = qs('#progressBar'); const a=qs('#article'); if(!a) return;
    const total = a.scrollHeight - innerHeight; const y = Math.min(total, Math.max(0, scrollY - (a.offsetTop - 80)));
    const p = total>0 ? y/total : 0; bar.style.transform = 'scaleX('+p+')';
  }
  function parx(){ const h=qs('.hero-figure'); if(!h) return; h.style.transform='translate3d(0,'+(scrollY*0.25)+'px,0)'; }

  window.addEventListener('scroll', ()=>{ progress(); parx(); }, {passive:true});
  window.addEventListener('resize', progress);
  load();
</script>
<script src="burger.js"></script>
</body>
</html>
